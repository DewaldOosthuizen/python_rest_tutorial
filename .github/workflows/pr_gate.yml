name: PR Gate
# Fast-feedback gate for pull requests targeting main.
# Runs lint -> test on every PR. Does not run on push to main; that is
# handled by release.yml (which re-validates the exact commit being tagged).

on:
  pull_request:
    branches: ["main"]

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install "ruff>=0.5.0"
      - name: ruff check
        run: ruff check web/ tests/
      - name: ruff format check
        run: ruff format --check web/ tests/

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r web/requirements-dev.txt
      - name: Run tests
        run: pytest -v
